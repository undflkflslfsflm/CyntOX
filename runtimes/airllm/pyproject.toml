[project]
name = "cyntox-airllm-runtime"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "accelerate==1.14.0",
  "airllm==3.3.0",
  "huggingface-hub==1.5.0",
  "safetensors==0.8.0",
  "torch==2.14.0+cu130",
  "transformers==5.12.1",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
